version: "2"

run:
  timeout: 2m

linters:
  # First adoption: correctness checks for bounded codecs, formats and baking.
  # The standard set includes errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  enable:
    - copyloopvar
    - durationcheck
    - errorlint
    - makezero
    - nilerr
    - nilnesserr
    - nosprintfhostport
    - predeclared
    - unconvert
    - revive
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      # Keep handwritten production source small; tests and generated codecs are exempt.
      rules:
        - name: file-length-limit
          arguments:
            - max: 500
              skip-comments: false
              skip-blank-lines: false
    staticcheck:
      checks: [all]
  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: '(.+)_test\.go'
        text: "file-length-limit:"
        linters: [revive]

formatters:
  enable:
    - gci
    - gofmt
    - golines
  settings:
    golines:
      max-len: 140
  exclusions:
    generated: strict
    paths:
      - "(^|/)dist(/|$)"
      - '(^|/)\.(karty|codex|agents)(/|$)'

output:
  path-mode: "abs"
