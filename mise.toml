[tools]
hk = "2.7.1"
taplo = "0.10.0"
uv = "0.13.2"
yamllint = { version = "1.38.0", uvx = true }
prettier = "3.9.10"
golangci-lint = "2.15.0"
go = "1.27.3"
node = "26.12.0"

# Go 1.27 portable SIMD; remove this gate when SIMD is enabled by default.
[env]
GOEXPERIMENT = "simd"

[hooks]
postinstall = "hk install --mise"

[shell_alias]
fmt = "mise run fmt"
lint = "mise run lint"
test = "mise run test"

[tasks.test]
depends = ["check-source-policy"]
run = "go test -timeout=9s ./..."

[tasks.check-source-policy]
description = "Check the production source size limit across every platform and build tag without test caching"
run = "go test -count=1 -timeout=9s ./internal/sourcepolicy"

[tasks.build]
run = "go build ./..."

[tasks.check]
run = ["mise run check-fmt", "mise run lint", "mise run test", "mise run build"]

[tasks.fmt]
run = "hk fix --all --profile format"

[tasks.check-fmt]
run = "hk check --all --profile format"

[tasks.lint]
run = "hk check --all"

[tasks.lint-go]
depends = ["check-source-policy"]
run = "golangci-lint run ./..."

[tasks.test-race]
# Keep race-instrumented atlas validation from competing with baker tests.
# Give dense producer and large-world fixtures their own nine-second budgets.
run = [
  "go test -p=1 -timeout=9s -race ./... -skip='^(TestProducerCompatibility|TestMeshOnlyWorldMayExceedOneMeshEntry)$'",
  "go test -timeout=9s -race ./bake/worldlightmap -run='^TestProducerCompatibility$'",
  "go test -timeout=9s -race ./format/worldchunk -run='^TestMeshOnlyWorldMayExceedOneMeshEntry$'",
]

[tasks.test-simd-emulated]
env = { GODEBUG = "simd=0" }
run = "go test -timeout=9s ./bake/worldlightmap"

[tasks.test-32]
env = { GOARCH = "386", CGO_ENABLED = "0" }
# The 386 SIMD fallback also needs an isolated producer compatibility budget.
run = [
  "go test -p=1 -timeout=9s ./... -skip='^TestProducerCompatibility$'",
  "go test -timeout=9s ./bake/worldlightmap -run='^TestProducerCompatibility$'",
]

# Execute packages one at a time to bound Node processes and Wasm memory use.
[tasks.test-wasm]
env = { GOOS = "js", GOARCH = "wasm" }
run = 'go test -p=1 -timeout=9s -exec="$PWD/scripts/go-wasm-exec" ./...'

[tasks.bench]
run = "go test -timeout=9s ./codec/... ./format/worldmaterial ./format/worldlightmap ./bake/worldlightmap -run=^$ -bench=. -benchmem"

# Each target gets a bounded exploration budget in addition to ordinary seed
# coverage. Cap workers to keep malformed-input memory use predictable in CI.
[tasks.fuzz]
env = { GOMAXPROCS = "2" }
run = [
  "bash scripts/go-fuzz ./codec/qoi FuzzInspectAndDecode",
  "bash scripts/go-fuzz ./codec/qoa FuzzInspectAndDecode",
  "bash scripts/go-fuzz ./codec/qoa FuzzStreamDecoder",
  "bash scripts/go-fuzz ./format/cartridge FuzzDecodeAssets",
  "bash scripts/go-fuzz ./format/cartridge FuzzExtractSection",
  "bash scripts/go-fuzz ./format/cartridge FuzzSoundsDecode",
  "bash scripts/go-fuzz ./format/cartridge FuzzDecodeAudioStreams",
  "bash scripts/go-fuzz ./format/cartridge FuzzMediaEnvelopeReader",
  "bash scripts/go-fuzz ./format/level FuzzEnvelopeDecode",
  "bash scripts/go-fuzz ./format/level FuzzMetadataDecode",
  "bash scripts/go-fuzz ./format/actions FuzzBinaryActionsDecode",
  "bash scripts/go-fuzz ./format/character FuzzDecode",
  "bash scripts/go-fuzz ./format/world FuzzDecode",
  "bash scripts/go-fuzz ./format/worldparticles FuzzParticleDecode",
  "bash scripts/go-fuzz ./format/worldvegetation FuzzVegetationDecode",
  "bash scripts/go-fuzz ./format/worldterrain FuzzDecode",
  "bash scripts/go-fuzz ./format/worldsky FuzzDecode",
  "bash scripts/go-fuzz ./format/world FuzzDecodeLighting",
  "bash scripts/go-fuzz ./format/worldchunk FuzzBinaryChunkCanonicalRoundTrip",
  "bash scripts/go-fuzz ./format/performance FuzzBinaryPerformance",
  "bash scripts/go-fuzz ./format/worldmaterial FuzzDecodeLayout",
  "bash scripts/go-fuzz ./format/worldlightmap FuzzDecodeLayout",
  "bash scripts/go-fuzz ./format/worldlightmap FuzzDecodePrebake",
  "bash scripts/go-fuzz ./format/worldlightmap FuzzDecodeEnvironmentVariants",
]

[tasks.install-hooks]
description = "Install repository hk hooks with the pinned mise environment"
run = "hk install --mise"

[tasks.generate-world]
run = "go run ./internal/codegen/binary ."

[tasks.fmt-fluids]
run = [
  "golangci-lint fmt format/world/fluids*.go format/world/codec.go format/world/types.go format/world/validate.go format/worldsource/fluids.go format/worldsource/types.go format/worldsource/validate.go format/cartridge/fluids_test.go format/cartridge/manifest.go format/asset/contract.go format/worldlightmap/fluids_test.go format/worldlightmap/offline.go format/worldlightmap/environment_variants.go internal/codegen/binary/main.go",
  "prettier --write format/world/README.md",
]
